description: 'Electra Therapeutics is a clinical-stage biotechnology company in South San Francisco,
  California, founded in 2018 and pioneering first-in-class antibody therapies directed at signal
  regulatory proteins (SIRP) for immunological diseases and cancer. Its lead candidate, ELA026
  (ipsoprubart), is a monoclonal antibody targeting SIRP-alpha/beta1/gamma on myeloid cells and
  T lymphocytes to selectively deplete the pathological immune cells that drive the cytokine storm in
  secondary hemophagocytic lymphohistiocytosis (sHLH); it is in the pivotal SURPASS Phase 2/3 study.
  A second SIRP-targeted program, ELA822, is directed at activated T lymphocytes for immunology and
  inflammation indications. The company has raised roughly $267M from investors including OrbiMed,
  Nextech Invest, EQT Life Sciences and Westlake Village BioPartners. Electra publishes a corporate
  website, pipeline, publications, clinical-trial and news pages, but no public developer program,
  API documentation, or machine-readable API contract of any kind.'
